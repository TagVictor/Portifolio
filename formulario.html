<!--
    ================================================================
    LEGENDA DOS COMENTÁRIOS DE CHECKPOINT NESTE ARQUIVO:
    CP1 -> Estrutura HTML semântica e formulário
    CP2 -> Responsividade (herdada do style.css)
    CP3 -> Validação do formulário via JavaScript (ainda pendente)
    ================================================================
-->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
    <title>Contato | Victor Gabriel</title>
</head>
<body class="pagina-interna">
 
    <!-- ===== CP1: CABEÇALHO (igual ao restante do site) ===== -->
    <header>
        <div class="interface">
            <div class="logo">
                <a href="index.html">
                    <img src="img/logo portifó 50x50.png" alt="Victor">
                </a>
            </div><!--logo-->
            <nav class="menu-desktop">
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="formulario.html" class="ativo">Contato</a></li>
                    <li><a href="curriculo.html">Curriculo</a></li>
                    <li><a href="#projetos">Projetos</a></li>
                    <li><a href="graficos.html">Gráficos</a></li>
                    <li><a href="multimidia.html">Multimídia</a></li>
                </ul>
            </nav><!--Menu Desktop-->
 
            <div class="btn-abrir-menu" id="btn-menu">
                <i class="bi bi-list"></i>
            </div>
 
            <div class="menu-mobile" id="menu-mobile">
                <div class="btn-fechar">
                    <i class="bi bi-x-lg"></i>
                </div>
 
                <nav>
                    <ul>
                        <li><a href="index.html">Início</a></li>
                        <li><a href="curriculo.html">Curriculo</a></li>
                        <li><a href="#projetos">Projetos</a></li>
                        <li><a href="formulario.html" class="ativo">Contato</a></li>
                        <li><a href="graficos.html">Gráficos</a></li>
                        <li><a href="multimidia.html">Multimídia</a></li>
                    </ul>
                </nav>
            </div><!--menu-mobile-->
            <div class="overlay-menu" id="overlay-menu"></div>
        </div><!--INTERFACE-->
    </header>
 
    <!-- ===== CP1: CONTEÚDO PRINCIPAL ===== -->
    <main>
        <!-- CP1: seção do formulário de contato -->
        <section id="formulario" class="formulario">
            <div class="interface">
                <h2 class="titulo">FALA<span>COMIGO.</span></h2>
 
                <!--
                    CORRIGIDO: cada campo agora tem name + id (necessário pra
                    enviar os dados e pra ler os valores via JavaScript no CP3),
                    e um <label> associado (sr-only = só aparece pra leitor de
                    tela, sem mudar o visual do formulário).
                -->
                <form action="" id="form-contato">
                    <label for="nome" class="sr-only">Seu nome completo</label>
                    <input type="text" name="nome" id="nome" placeholder="Seu nome completo:" required>
 
                    <label for="email" class="sr-only">Seu e-mail</label>
                    <input type="email" name="email" id="email" placeholder="Seu e-mail:" required>
 
                    <label for="celular" class="sr-only">Seu celular</label>
                    <input type="tel" name="celular" id="celular" placeholder="Seu celular:">
 
                    <label for="mensagem" class="sr-only">Sua mensagem</label>
                    <textarea name="mensagem" id="mensagem" placeholder="Sua mensagem" required></textarea>
 
                    <div class="btn-enviar"><input type="submit" value="ENVIAR"></div>
                </form>
            </div><!--interface-->
        </section><!--formulario-->
    </main>
 
</body>
</html>
