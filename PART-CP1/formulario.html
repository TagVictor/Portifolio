    <!-- ===== CP1: CONTEÚDO PRINCIPAL ===== -->
    <main>
        <!-- CP1: seção do formulário de contato -->
        <section id="formulario" class="formulario">
            <div class="interface">
                <h2 class="titulo">FALA<span>COMIGO.</span></h2>

                <!-- CP1: cada campo tem name + id e um <label> associado (sr-only) -->
                <form action="" id="form-contato">
                    <label for="nome" class="sr-only">Seu nome completo</label>
                    <input type="text" name="nome" id="nome" placeholder="Seu nome completo:" required>

                    <label for="email" class="sr-only">Seu e-mail</label>
                    <input type="email" name="email" id="email" placeholder="Seu e-mail:" required>

                    <label for="celular" class="sr-only">Seu celular</label>
                    <input type="tel" name="celular" id="celular" placeholder="Seu celular:">

                    <label for="assunto" class="sr-only">Assunto</label>
                    <input type="text" name="assunto" id="assunto" placeholder="Assunto:" required>

                    <label for="mensagem" class="sr-only">Sua mensagem</label>
                    <textarea name="mensagem" id="mensagem" placeholder="Sua mensagem" required></textarea>

                    <div class="btn-enviar"><input type="submit" value="ENVIAR"></div>
                </form>
            </div><!--interface-->
        </section><!--formulario-->
    </main>

    <!-- ===== CP1: RODAPÉ (igual ao restante do site) ===== -->
